[package]
name = "prediction-market-pinocchio"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
publish = false

[lib]
crate-type = ["cdylib", "lib"]

[features]
no-entrypoint = []
svm-tests = []
# Comparison builds only: unrestricted SPL venues do not enforce this program's
# cutoff or execution fees. Never enable this feature in a production build.
external-venue-comparison = []

[dependencies]
pinocchio = { version = "=0.11.2", features = ["cpi"] }
pinocchio-system = "=0.6.1"
pinocchio-token = "=0.7.0"
solana-sha256-hasher = { version = "=3.1.0", features = ["sha2"] }
solana-address = { version = "=2.2.0", features = ["decode", "curve25519"] }

[dev-dependencies]
litesvm = { version = "=0.9.1", features = ["precompiles"] }
solana-account = "3"
solana-clock = "3"
solana-instruction = "3"
solana-keypair = "3"
solana-message = "3"
solana-pubkey = "4"
solana-signer = "3"
solana-transaction = "3"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
